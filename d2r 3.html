function makeMeteor(){
  const g=new THREE.Group();
  const ring=new THREE.Mesh(R3.geo.ring,new THREE.MeshBasicMaterial({color:0xff7828,transparent:true,depthWrite:false})); ring.scale.set(120*U,1,120*U); ring.position.y=0.04; g.add(ring);
  const fill=new THREE.Mesh(R3.geo.disc,new THREE.MeshBasicMaterial({color:0xff5a14,transparent:true,depthWrite:false})); fill.position.y=0.03; g.add(fill);
  const rock=new THREE.Mesh(R3.geo.ball,new THREE.MeshBasicMaterial({color:0xffcf70})); rock.scale.setScalar(0.22); g.add(rock);
  g.userData={ring,fill,rock}; return g;
}

// 每一幀：確保每個遊戲物件都有對應的 3D 模型，沒用到的就移除
function sync(list,make,upd){
  for(const o of list){
    let m=R3.meshes.get(o);
    if(!m){ m=make(o); R3.meshes.set(o,m); R3.dyn.add(m); R3.scene.add(m); }
    m.userData.seen=R3.frame; upd(o,m);
  }
}
function sweep(){
  for(const m of R3.dyn) if(m.userData.seen!==R3.frame){
    R3.scene.remove(m); R3.dyn.delete(m);
    m.traverse(o=>{ if(o.material&&!Object.values(R3.mat).includes(o.material)&&!R3.rar.includes(o.material)) o.material.dispose(); });
  }
}
function faceTo(m,a){ m.rotation.y=-a+Math.PI/2; }   // 遊戲裡的角度 → 3D 旋轉

// 螢幕座標 ↔ 世界座標
function proj3(x,y,h){ const v=R3.v.set(x*U,h,y*U).project(R3.cam); return {x:(v.x+1)/2*R3.w,y:(1-v.y)/2*R3.h,z:v.z}; }
function ground3(sx,sy){
  R3.v2.set(sx/R3.w*2-1,-(sy/R3.h)*2+1); R3.ray.setFromCamera(R3.v2,R3.cam);
  const hit=R3.ray.ray.intersectPlane(R3.ground,R3.v); return hit?{x:hit.x/U,y:hit.z/U}:{x:G.p.x,y:G.p.y};
}
const use3D=()=>view3D&&R3.ok;

function draw3D(time){
  R3.frame++;
  const r=cv.getBoundingClientRect(), dpr=Math.min(isTouch?1.5:2,window.devicePixelRatio||1);
  if(R3.w!==r.width||R3.h!==r.height||R3.dpr!==dpr){
    R3.w=r.width; R3.h=r.height; R3.dpr=dpr;
    R3.renderer.setPixelRatio(dpr); R3.renderer.setSize(r.width,r.height,false);
    R3.cam.aspect=r.width/r.height; R3.cam.fov=R3.cam.aspect<1?55:40; R3.cam.updateProjectionMatrix();
  }
  if(R3.map!==G.map) buildLevel();
  const p=G.p, px=p.x*U, pz=p.y*U;
  // 鏡頭：從斜上方往下看（像暗黑系列），跟著角色
  let sx=0,sz=0; if(G.shake>0){ sx=rand(-1,1)*G.shake*0.35; sz=rand(-1,1)*G.shake*0.35; }
  R3.cam.position.set(px+sx,8.6,pz+6.2+sz); R3.cam.lookAt(px+sx,0.4,pz+sz);
  R3.cam.updateMatrixWorld();
  const gp=ground3(ptr.sx,ptr.sy); ptr.wx=gp.x; ptr.wy=gp.y;

  // 擋住角色的牆壓低，才看得到角色
  const wm=R3.wallMesh, M=new THREE.Matrix4(); let changed=false;
  for(const w of R3.wallList){
    const cut=w.z>pz+0.2&&w.z<pz+3.2&&Math.abs(w.x-px)<2.2;
    if(cut!==w.cut){ w.cut=cut; M.makeScale(1,cut?0.12:1,1).setPosition(w.x,0,w.z); wm.setMatrixAt(w.k,M); changed=true; }
  }
  if(changed) wm.instanceMatrix.needsUpdate=true;

  // 光：角色火把＋最近的火盆
  R3.pLight.position.set(px,2.2,pz); R3.pLight.intensity=BR().pl+Math.sin(time/130)*0.08;
  const near=[...R3.braziers].sort((a,b)=>Math.hypot(a.d.x-p.x,a.d.y-p.y)-Math.hypot(b.d.x-p.x,b.d.y-p.y));
  R3.bLights.forEach((l,i)=>{ const b=near[i]; if(!b){ l.intensity=0; return; } l.position.set(b.d.x*U,0.9,b.d.y*U); l.intensity=1.6+bright*0.3+Math.sin(time/110+b.d.ph)*0.15; });
  for(const b of R3.braziers){ const f=1+Math.sin(time/90+b.d.ph)*0.15; b.f.scale.y=0.3*f; b.c.scale.y=0.18*f; }

  // 傳送門
  R3.portal.visible=!!G.portal; R3.portalLight.intensity=G.portal?1.8:0;
  if(G.portal){ R3.portal.position.set(G.portal.x*U,0,G.portal.y*U); R3.portal.children.forEach((c,i)=>{ if(i<3) c.rotation.z=G.portal.a*(i%2?-1:1)+i; });
    R3.portal.rotation.y=0; R3.portalLight.position.set(G.portal.x*U,1,G.portal.y*U); }

  // 玩家
  sync(G.dead?[]:[p],makePlayer,(o,m)=>{
    const u=m.userData; m.position.set(px,0,pz); faceTo(m,o.face);
    if(u.cls!==o.cls){ u.cls=o.cls; u.bodyMat.color.set(cls().cape); }
    const wr=o.equip.weapon?o.equip.weapon.rarity:-1; if(u.wr!==wr){ u.wr=wr; u.blade.material.color.set(wr>=0?RAR[wr].c:'#8c7a5e'); }
    const sw=o.swing>0?(o.swing/0.18-0.5)*1.8:0.6; u.arm.rotation.y=o.whirl>0?time/60:-sw;
    u.bodyMat.emissive.setHex(0x000000);
  });
  R3.whirl.visible=p.whirl>0&&!G.dead; if(R3.whirl.visible){ R3.whirl.position.set(px,0.45,pz); R3.whirl.scale.setScalar(0.6+Math.sin(time/40)*0.05); R3.whirl.rotation.z=time/50; }
  R3.buff.visible=p.buff>0&&!G.dead; if(R3.buff.visible){ R3.buff.position.set(px,0.04,pz); R3.buff.scale.setScalar(0.38*(1+Math.sin(time/120)*0.1)); R3.buff.material.opacity=Math.min(1,p.buff)*0.7; }
  R3.moveMark.visible=!!(G.move&&!ptr.down); if(G.move) R3.moveMark.position.set(G.move.x*U,0.03,G.move.y*U);

  // 怪物
  sync(G.foes,makeFoe,(e,m)=>{
    const u=m.userData; let lx=0,lz=0;
    const a=Math.atan2((e.tgy??p.y)-e.y,(e.tgx??p.x)-e.x);
    if(e.lunge>0){ lx=Math.cos(a)*0.12; lz=Math.sin(a)*0.12; }
    m.position.set(e.x*U+lx,0,e.y*U+lz); if(e.aggro) faceTo(m,a);
    u.bodyMat.emissive.setHex(e.hit>0?0xffffff:e.curse>0?0x301040:e.slow>0?0x10283a:0x000000);
    u.inner.position.y=Math.abs(Math.sin(time/120+e.x))*0.03;   // 走路時上下晃
  });
  // 骷髏僕從
  sync(G.allies,makeAlly,(a,m)=>{ m.position.set(a.x*U,0,a.y*U); faceTo(m,a.face||0); m.userData.arm.rotation.y=a.sw>0?-(a.sw/0.15-0.5)*1.6:-0.5; m.userData.bodyMat.emissive.setHex(a.hit>0?0xffffff:0); });
  // 地上的東西
  sync(G.drops,makeDrop,(d,m)=>{ m.position.set(d.x*U,0,d.y*U); if(m.userData.gem){ m.userData.gem.rotation.y=time/600; m.userData.gem.position.y=0.25+Math.sin(time/300+d.x)*0.04; } });
  sync(G.corpses,makeCorpse,(c,m)=>{ m.position.x=c.x*U; m.position.z=c.y*U; m.material.opacity=Math.min(1,c.t/3)*0.7; });
  sync(G.proj,makeProj,(b,m)=>{ m.position.set(b.x*U,0,b.y*U); faceTo(m,b.a); });
  sync(G.meteors,makeMeteor,(mt,m)=>{ const q=mt.t/mt.max, u=m.userData; m.position.set(mt.x*U,0,mt.y*U);
    u.ring.material.opacity=0.4+q*0.5; u.fill.scale.set(120*U*q,1,120*U*q); u.fill.material.opacity=0.1+q*0.25;
    u.rock.position.set((1-q)*2.5,0.2+(1-q)*6,-(1-q)*1); });
  sweep();

  // 特效光圈（火焰新星、震地、爆炸……）
  const rings=G.fx.filter(f=>f.k==='ring');
  R3.rings.forEach((m,i)=>{ const f=rings[i]; if(!f){ m.visible=false; return; }
    const q=f.t/f.max, R=(20+q*((f.rad||150)-15))*U; m.visible=true; m.position.set(f.x*U,0.05,f.y*U); m.scale.set(R,1,R);
    const c=(f.c||'255,140,40').split(',').map(Number); m.material.color.setRGB(c[0]/255,c[1]/255,c[2]/255); m.material.opacity=1-q; });

  R3.renderer.render(R3.scene,R3.cam);
  drawOverlay3D(time);
}

// 3D 畫面上方的 2D 圖層：名字、血條、傷害數字、粒子、小地圖
function drawOverlay3D(time){
  const dpr=Math.min(2,window.devicePixelRatio||1), cw=Math.round(R3.w*dpr), ch=Math.round(R3.h*dpr);
  if(cv.width!==cw||cv.height!==ch){ cv.width=cw; cv.height=ch; }
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,R3.w,R3.h);
  const p=G.p, hov=hoverFoe();
  // 粒子
  for(const f of G.fx){
    if(f.k==='p'){ const s=proj3(f.x,f.y,0.5); ctx.globalAlpha=Math.max(0,f.t/0.35); ctx.fillStyle=f.c; ctx.fillRect(s.x-2,s.y-2,4,4); }
    else if(f.k==='beam'){ const a=proj3(f.x2,f.y2,0.5), b=proj3(p.x,p.y,0.5), q=f.t/f.max;
      ctx.globalAlpha=1-q; ctx.strokeStyle='#c82828'; ctx.lineWidth=5*(1-q)+1; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.quadraticCurveTo((a.x+b.x)/2+Math.sin(time/40)*10,(a.y+b.y)/2-20,b.x,b.y); ctx.stroke(); ctx.lineCap='butt'; }
  }
  ctx.globalAlpha=1;
  // 怪物頭上：血條、暈眩、詛咒、選取圈
  for(const e of G.foes){
    const top=(e.boss?1.45:e.type==='imp'?0.85:1.05);
    const s=proj3(e.x,e.y,top); if(s.z>1) continue;
    const w=Math.max(26,e.r*2.2);
    if(e.hp<e.max||e===hov||e===G.target){ ctx.fillStyle='rgba(0,0,0,.8)'; ctx.fillRect(s.x-w/2,s.y-6,w,5); ctx.fillStyle='#c4291f'; ctx.fillRect(s.x-w/2,s.y-6,w*Math.max(0,e.hp)/e.max,5); }
    if(e===hov||e===G.target){ const f=proj3(e.x,e.y,0); ctx.strokeStyle='#ff6a5a'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.ellipse(f.x,f.y,w*0.7,w*0.32,0,0,7); ctx.stroke(); }
    if(e.stun>0){ ctx.fillStyle='#ffd36a'; for(let n=0;n<3;n++){ const t=time/200+n*2.1; ctx.fillRect(s.x+Math.cos(t)*w*0.4-2,s.y-14+Math.sin(t)*3,4,4); } }
    if(e.curse>0){ ctx.fillStyle='rgba(190,110,240,.95)'; ctx.beginPath(); ctx.moveTo(s.x,s.y-26); ctx.lineTo(s.x-5,s.y-19); ctx.lineTo(s.x,s.y-12); ctx.lineTo(s.x+5,s.y-19); ctx.fill(); }
  }
  for(const a of G.allies) if(a.hp<a.max){ const s=proj3(a.x,a.y,0.95); ctx.fillStyle='#000'; ctx.fillRect(s.x-12,s.y-4,24,3); ctx.fillStyle='#6fe07a'; ctx.fillRect(s.x-12,s.y-4,24*a.hp/a.max,3); }
  // 物品名稱
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='12px "Noto Serif TC",serif';
  for(const d of G.drops){
    if(d.kind!=='item'){ d.lab3=null; continue; }
    const s=proj3(d.x,d.y,0.55); const t=d.item.name, w=ctx.measureText(t).width+10;
    d.lab3={x:s.x-w/2,y:s.y-9,w,h:17};
    ctx.fillStyle='rgba(8,6,5,.82)'; ctx.fillRect(d.lab3.x,d.lab3.y,w,17);
    if(G.pickT===d){ ctx.strokeStyle=RAR[d.item.rarity].c; ctx.lineWidth=1; ctx.strokeRect(d.lab3.x,d.lab3.y,w,17); }
    ctx.fillStyle=RAR[d.item.rarity].c; ctx.fillText(t,s.x,s.y);
  }
  // 傷害數字
  for(const t of G.texts){
    const s=proj3(t.x,t.y,1.0+t.t*0.6); ctx.globalAlpha=1-t.t/0.9; ctx.font=`700 ${t.size}px "Noto Serif TC",serif`;
    ctx.fillStyle='#000'; ctx.fillText(t.s,s.x+1,s.y+1); ctx.fillStyle=t.c; ctx.fillText(t.s,s.x,s.y);
  }
  ctx.globalAlpha=1;
  const show=hov||G.target;
  if(show){
    const bw=Math.min(240,R3.w-40), bx=(R3.w-bw)/2;
    ctx.fillStyle='rgba(0,0,0,.75)'; ctx.fillRect(bx,10,bw,22);
    ctx.fillStyle='#7a1610'; ctx.fillRect(bx,10,bw*Math.max(0,show.hp)/show.max,22);
    ctx.strokeStyle='#3b2f24'; ctx.strokeRect(bx,10,bw,22);
    ctx.font='700 13px "Noto Serif TC",serif'; ctx.fillStyle=show.boss?'#e8822e':show.elite?'#cfa84e':'#e0d3bd';
    ctx.fillText(show.n,R3.w/2,21.5);
  }
  drawMinimap({width:R3.w,height:R3.h},dpr);
}

// 切換 2D／3D
function setView(v3){
  if(v3&&!init3D()){ v3=false; if(G) addLog('這台裝置不支援 3D，改用 2D 畫面。'); }
  view3D=v3; try{ localStorage.setItem('ember-crypt-view',v3?'3d':'2d'); }catch(e){}
  cv3.hidden=!v3; cv.classList.toggle('overlay',v3);
  const b=document.getElementById('bViewTxt'); if(b) b.textContent=v3?'3D 畫面':'2D 畫面';
}

// 手指比滑鼠粗，觸控時點擊判定範圍放大
const tapPad=()=>isTouch?20:8;
function hoverFoe(){
  let best=null,bd=1e9;
  if(use3D()&&R3.w){ // 3D：用螢幕上的位置判斷滑鼠指著哪隻怪
    for(const e of G.foes){
      const h=e.boss?0.7:0.45, s=proj3(e.x,e.y,h), s2=proj3(e.x+e.r*1.3,e.y,h);
      const rad=Math.max(14,Math.abs(s2.x-s.x)*1.3)+(isTouch?16:6), d=Math.hypot(s.x-ptr.sx,s.y-ptr.sy);
      if(d<rad&&d<bd){bd=d;best=e;}
    }
    return best;
  }
  for(const e of G.foes){ const d=Math.hypot(e.x-ptr.wx,e.y-ptr.wy); if(d<e.r+tapPad()&&d<bd){bd=d;best=e;} }
  return best;
}

// ---------- 輸入 ----------
function setPtr(ev){ const r=cv.getBoundingClientRect(); ptr.sx=ev.clientX-r.left; ptr.sy=ev.clientY-r.top;
  if(use3D()&&R3.w){ const g=ground3(ptr.sx,ptr.sy); ptr.wx=g.x; ptr.wy=g.y; } else { ptr.wx=ptr.sx/Z+cam.x; ptr.wy=ptr.sy/Z+cam.y; } }
cv.addEventListener('pointerdown',ev=>{
  ev.preventDefault();
  if(ev.pointerType==='touch') enableTouch();
  if(ptr.down&&ev.pointerId!==ptr.id) return;   // 已經有一根手指在移動，其他手指不搶
  setPtr(ev);
  if(G.dead){ revive(); return; }
  if(ev.button===2){ cast('nova',false); return; }
  try{cv.setPointerCapture(ev.pointerId);}catch(e){}
  ptr.down=true; ptr.id=ev.pointerId; G.target=null; G.pickT=null; G.move=null;
  const f=hoverFoe(); if(f){ G.target=f; return; }
  const pad=isTouch?10:0;
  for(const d of G.drops){
    const L3=use3D()?d.lab3:null;
    if(L3&&ptr.sx>=L3.x-pad&&ptr.sx<=L3.x+L3.w+pad&&ptr.sy>=L3.y-pad&&ptr.sy<=L3.y+L3.h+pad){ G.pickT=d; return; }
    const L=use3D()?null:d.lab;
    if((L&&ptr.wx>=L.x-pad&&ptr.wx<=L.x+L.w+pad&&ptr.wy>=L.y-pad&&ptr.wy<=L.y+L.h+pad)||Math.hypot(d.x-ptr.wx,d.y-ptr.wy)<16+pad){ G.pickT=d; return; }
  }
  G.move={x:ptr.wx,y:ptr.wy};
});
cv.addEventListener('pointermove',ev=>{ if(ptr.down&&ev.pointerId!==ptr.id) return; setPtr(ev); });
const up=ev=>{ if(ev.pointerId===ptr.id) ptr.down=false; };
cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);

// 按鈕在觸控時用「按下就觸發」，反應比 click 快，也能一手移動一手放技能
let lastTap=0;   // 記錄最後一次按下的時間，避免同一下又被 click 觸發一次
const fromKeyboard=e=>e.detail===0&&performance.now()-lastTap>600;
function onTap(el,fn){
  el.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse'&&e.button!==0) return; e.preventDefault(); lastTap=performance.now(); fn(); });
  el.addEventListener('click',e=>{ if(fromKeyboard(e)) fn(); });   // 鍵盤 Enter／空白鍵
}
document.addEventListener('pointerdown',e=>{
  const c=e.target.closest('[data-cast]'); if(!c) return;
  e.preventDefault(); lastTap=performance.now(); if(!paused) cast(c.dataset.cast,true);
});

// ---------- 平板／觸控模式 ----------
let isTouch=false;
function enableTouch(){
  if(isTouch) return;
  isTouch=true; document.body.classList.add('touch');
  $('stage').appendChild($('log'));          // 訊息疊在遊戲畫面左上角
  fitStage();
  if(G) addLog('觸控操作：點地面移動、按住持續走、點怪物攻擊，下方按鈕放技能。');
}
// 讓遊戲畫面＋HUD 剛好塞滿螢幕高度
function fitStage(){
  if(!isTouch) return;
  const h=Math.max(260,window.innerHeight-$('hud').offsetHeight-8-8-12);
  document.body.style.setProperty('--stageH',h+'px');
}
addEventListener('resize',fitStage);
addEventListener('orientationchange',()=>setTimeout(fitStage,250));
if('ResizeObserver' in window) new ResizeObserver(fitStage).observe($('hud'));
// 往下捲到背包時自動暫停，並出現「回到遊戲」按鈕
if('IntersectionObserver' in window){
  new IntersectionObserver(([en])=>{
    if(!isTouch) return;
    const away=en.intersectionRatio<0.35;
    $('bBack').hidden=!away;
    if(away&&G&&!G.dead&&!paused) setPause(true);
  },{threshold:[0,0.35,0.7]}).observe($('stage'));
}
onTap($('bBag'),()=>{ setPause(true); document.querySelector('.panels').scrollIntoView({behavior:'smooth',block:'start'}); });
onTap($('bBack'),()=>{ scrollTo({top:0,behavior:'smooth'}); setTimeout(()=>setPause(false),350); });
const fsEl=document.documentElement;
const canFull=!!(fsEl.requestFullscreen||fsEl.webkitRequestFullscreen)&&(document.fullscreenEnabled||document.webkitFullscreenEnabled);
if(!canFull) $('bFull').remove();
else onTap($('bFull'),()=>{
  try{
    if(document.fullscreenElement||document.webkitFullscreenElement) (document.exitFullscreen||document.webkitExitFullscreen).call(document);
    else { const p=(fsEl.requestFullscreen||fsEl.webkitRequestFullscreen).call(fsEl); if(p&&p.catch) p.catch(()=>addLog('這個瀏覽器不允許全螢幕。')); }
  }catch(e){ addLog('這個瀏覽器不允許全螢幕。'); }
});
document.addEventListener('fullscreenchange',()=>{ if($('bFull')) $('bFull').textContent=document.fullscreenElement?'離開全螢幕':'全螢幕'; setTimeout(fitStage,100); });
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea')) return;
  if(picking) return;                    // 選職業時不處理快捷鍵
  if(e.key==='v'||e.key==='V'){ setView(!view3D); return; }
  if(e.key==='b'||e.key==='B'){ setBright((bright+1)%3); return; }
  if(e.key==='p'||e.key==='P'||e.key==='Escape'){ e.preventDefault(); setPause(!paused); return; }
  if(paused) return;                     // 暫停時不能放技能或喝藥水
  if(e.key==='m'||e.key==='M'){ setSound(!SFX.on); return; }
  const sk=clsSkills().find(s=>keyOf(s)===e.key);
  if(sk) cast(sk.id,false);
  else if(e.key==='q'||e.key==='Q') potion();
});
onTap($('bPot'),()=>{ if(!paused) potion(); });

// ---------- 暫停 ----------
// 暫停時遊戲世界停止（怪物不動、冷卻不走），但畫面和介面照常
let paused=false;
function setPause(on){
  if(G&&G.dead) on=false;               // 死亡畫面不需要暫停
  paused=on;
  $('pauseOv').hidden=!on;
  $('bPauseTxt').textContent=on?'繼續':'暫停';
  ptr.down=false;
  if(on){ save(); $('banner').classList.remove('on'); }
}
onTap($('bPause'),()=>setPause(!paused));
$('pauseOv').addEventListener('pointerdown',e=>{ e.preventDefault(); setPause(false); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&G&&!G.dead) setPause(true); });   // 切到別的分頁時自動暫停
// ---------- 選擇職業 ----------
// mode：first＝第一次玩、new＝重新開始、migrate＝舊存檔還沒有職業
let picking=null;
function showClassPicker(mode){
  picking=mode; ptr.down=false;
  $('classTitle').textContent=mode==='migrate'?'地窖裡出現了職業':'選擇你的職業';
  $('classSub').textContent=mode==='migrate'?'選一個職業繼續冒險。等級、裝備和金幣都會保留，技能點會全部退還讓你重新分配。'
    :mode==='new'?'選好職業就會開始新角色，目前的存檔會被取代。':'每個職業有不同的屬性和 5 個專屬技能。';
  $('clsRow').innerHTML=Object.entries(CLASSES).map(([id,c])=>{
    const sk=SKILLS.filter(s=>s.cls===id);
    return `<button type="button" class="clscard" data-cls="${id}">
      <span class="cn" style="color:${{war:'#e0705a',sorc:'#7d95ff',necro:'#7ec98a'}[id]}">${c.n}</span>
      <span class="cd2">${c.desc}</span>
      <span class="st">生命 ${c.hp+c.hpL} · 法力 ${c.mp+c.mpL} · 每升一級 +${c.hpL} 生命、+${c.mpL} 法力</span>
      <ul>${sk.map(s=>`<li>${s.n}（等級 ${s.req}）</li>`).join('')}</ul></button>`; }).join('');
  $('bClsCancel').hidden=mode!=='new';
  $('classOv').hidden=false;
}
function chooseClass(id){
  const mode=picking; picking=null; $('classOv').hidden=true;
  if(mode==='migrate'){
    const p=G.p; p.cls=id; p.skills={}; p.skills[clsSkills()[0].id]=1; p.points=Math.max(0,p.level-1);
    G.allies=[]; p.buff=0; p.cds={}; recalc(); p.hp=S.maxHp; p.mp=S.maxMp;
    addLog(`你成為了${cls().n}。技能點已退還 ${p.points} 點，到技能面板重新分配。`); renderUI(); save();
  } else { try{ localStorage.removeItem(SAVE_KEY); }catch(e){} newGame(null,id); }
  sfx('level');
}
$('clsRow').addEventListener('click',e=>{ const c=e.target.closest('[data-cls]'); if(c) chooseClass(c.dataset.cls); });
$('bClsCancel').onclick=()=>{ picking=null; $('classOv').hidden=true; };
$('bNew').onclick=()=>showClassPicker('new');
onTap($('bSnd'),()=>setSound(!SFX.on));
onTap($('bView'),()=>setView(!view3D));
onTap($('bBright'),()=>setBright((bright+1)%3));
document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(); });
addEventListener('pagehide',save);

// ---------- 介面（裝備、背包、物品資訊）----------
function mainStat(it){ return it.dmgMin?`傷害 ${it.dmgMin}–${it.dmgMax}`:it.armor?`護甲 ${it.armor}`:''; }
function cardHTML(it){
  const af=it.affixes.map(a=>`<li>${AFFIX.find(x=>x.k===a.k).f(a.v)}</li>`).join('');
  return `<div class="card"><div class="t c${it.rarity}">${it.name}</div>
    <div class="s">${RAR[it.rarity].n}${SLOTN[it.slot]}${it.rarity===3?'（'+it.base+'）':''} · 物品等級 ${it.ilvl}</div>
    ${mainStat(it)?`<div class="main">${mainStat(it)}</div>`:''}${af?`<ul>${af}</ul>`:''}</div>`;
}
function cellHTML(it,label){
  if(!it) return label?`<span class="lb">${label}</span><span class="lb">—</span>`:'';
  return `${label?`<span class="lb">${label}</span>`:''}<span class="g c${it.rarity}">${GLYPH[it.slot]}</span>${label?`<span class="nm c${it.rarity}">${it.name}</span>`:''}`;
}
function renderUI(){
  if(!G) return;
  const p=G.p, sel=G.sel;
  $('equip').innerHTML=SLOTS.map(s=>`<button type="button" class="cell slot${sel&&sel.from==='eq'&&sel.slot===s?' sel':''}" data-eq="${s}" ${p.equip[s]?'':'disabled'}>${cellHTML(p.equip[s],SLOTN[s])}</button>`).join('');
  let b=''; for(let i=0;i<BAG_MAX;i++){ const it=p.bag[i];
    b+=`<button type="button" class="cell${sel&&sel.from==='bag'&&sel.i===i?' sel':''}" data-bag="${i}" ${it?'':'disabled'} ${it?`title="${it.name}"`:''}>${cellHTML(it)}</button>`; }
  $('bag').innerHTML=b; $('bagCount').textContent=`${p.bag.length} / ${BAG_MAX}`;
  $('stats').innerHTML=[['攻擊傷害',`${S.dmgMin}–${S.dmgMax}`],['護甲',S.armor+`（減傷 ${Math.round(S.armor/(S.armor+60)*100)}%）`],['攻擊速度','+'+Math.min(150,S.aspd)+'%'],['爆擊率',S.crit+'%'],['生命竊取',S.leech+'%']]
    .map(([a,v])=>`<dt>${a}</dt><dd>${v}</dd>`).join('');
  // 技能列（HUD）與技能面板
  $('skillbar').innerHTML=clsSkills().map(s=>{ const r=rk(s.id), lock=r<=0;
    return `<button class="btn${lock?' lock':''}" type="button" data-cast="${s.id}"><kbd>${keyOf(s)}</kbd>${s.n}${lock?` <span class="k">${p.level<s.req?'等級 '+s.req:'未學'}</span>`:''}<span class="cd" id="cd-${s.id}"></span></button>`; }).join('');
  $('pts').textContent=`可用技能點：${p.points}`; $('pts').classList.toggle('has',p.points>0);
  $('sklist').innerHTML=clsSkills().map(s=>{ const r=rk(s.id), can=p.points>0&&p.level>=s.req&&r<SKILL_MAX;
    const lbl=r>=SKILL_MAX?'已滿級':p.level<s.req?`需要等級 ${s.req}`:r===0?'學習':'強化';
    return `<div class="skc${r===0?' off':''}"><div class="hd"><span class="t">${s.n} <span class="k kb-only">[${keyOf(s)}]</span></span><span class="rk">${r} / ${SKILL_MAX} 級</span></div>
      <p>${s.d(Math.max(1,r))}</p><div class="meta">法力 ${s.mp} · 冷卻 ${s.cd} 秒</div>
      <button class="btn" type="button" data-learn="${s.id}" ${can?'':'disabled'}>${lbl}</button></div>`; }).join('');

  $('clsName').textContent=cls().n;
  $('lv').textContent=p.level; $('fl').textContent=G.floor; $('gold').textContent=p.gold; $('pots').textContent=p.potions;

  const d=$('detail');
  const it=sel?(sel.from==='bag'?p.bag[sel.i]:p.equip[sel.slot]):null;
  if(!it){ G.sel=null; d.innerHTML='<p class="empty">點背包或裝備欄裡的物品，查看屬性並裝備。<br>顏色代表稀有度：<span class="c0">普通</span>、<span class="c1">魔法</span>、<span class="c2">稀有</span>、<span class="c3">傳奇</span>。</p>'; return; }
  const val=(it.rarity+1)*3*it.ilvl;
  if(sel.from==='bag'){
    const cur=p.equip[it.slot];
    d.innerHTML=cardHTML(it)+`<p class="cmp">目前裝備：${cur?`<span class="c${cur.rarity}">${cur.name}</span> ${mainStat(cur)}${cur.affixes.length?'，'+cur.affixes.length+' 個詞綴':''}`:'無'}</p>
      <div class="acts"><button class="btn" type="button" data-act="equip">裝備</button><button class="btn" type="button" data-act="salvage">分解（+${val} 金幣）</button></div>`;
  } else {
    d.innerHTML=cardHTML(it)+`<div class="acts"><button class="btn" type="button" data-act="unequip">卸下</button></div>`;
  }
}
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-bag],[data-eq],[data-act],[data-cast],[data-learn]'); if(!c||!G) return;
  const p=G.p;
  if(c.dataset.cast){ if(fromKeyboard(e)&&!paused) cast(c.dataset.cast,true); return; }   // 滑鼠和觸控已在 pointerdown 處理
  if(c.dataset.learn){ learn(c.dataset.learn); }
  else if(c.dataset.bag!==undefined){ G.sel={from:'bag',i:+c.dataset.bag}; }
  else if(c.dataset.eq){ G.sel={from:'eq',slot:c.dataset.eq}; }
  else {
    const a=c.dataset.act, sel=G.sel; if(!sel) return;
    if(a==='equip'){ const it=p.bag[sel.i], old=p.equip[it.slot]; p.equip[it.slot]=it; p.bag.splice(sel.i,1); if(old) p.bag.splice(sel.i,0,old);
      recalc(); addLog(`裝備了 <span class="c${it.rarity}">${it.name}</span>。`); G.sel={from:'eq',slot:it.slot}; }
    else if(a==='salvage'){ const it=p.bag[sel.i]; const v=(it.rarity+1)*3*it.ilvl; p.gold+=v; p.bag.splice(sel.i,1); addLog(`分解了 ${it.name}，獲得 ${v} 金幣。`); G.sel=null; }
    else if(a==='unequip'){ if(p.bag.length>=BAG_MAX){ addLog('背包已滿。'); return; } const it=p.equip[sel.slot]; p.equip[sel.slot]=null; p.bag.push(it); recalc(); G.sel={from:'bag',i:p.bag.length-1}; }
  }
  renderUI();
});

// HUD 每幀更新（血球、法力球、經驗條、冷卻）
function hud(){
  const p=G.p;
  $('hpFill').style.height=(100*p.hp/S.maxHp)+'%'; $('hpTxt').textContent=`${Math.ceil(p.hp)}/${S.maxHp}`;
  $('mpFill').style.height=(100*p.mp/S.maxMp)+'%'; $('mpTxt').textContent=`${Math.floor(p.mp)}/${S.maxMp}`;
  $('xpFill').style.width=(100*p.xp/need())+'%';
  for(const s of SKILLS){ const el=document.getElementById('cd-'+s.id); if(el) el.style.width=(Math.max(0,p.cds[s.id]||0)/s.cd*100)+'%'; }
  $('potCd').style.width=(Math.max(0,p.potCd)*100)+'%';
  $('left').textContent=G.foes.length;
}

let bannerT;
function banner(t,sub){ const b=$('banner'); b.innerHTML=t+(sub?`<small>${sub}</small>`:''); b.classList.add('on'); clearTimeout(bannerT); if(!G||!G.dead||t!=='你死了') bannerT=setTimeout(()=>b.classList.remove('on'),2200); }
function addLog(s){ G.log.push(s); if(G.log.length>4) G.log.shift(); $('log').innerHTML=G.log.map(x=>`<div>${x}</div>`).join(''); }

// ---------- 主迴圈 ----------
let last=0;
function loop(t){
  const dt=Math.min(0.05,(t-last)/1000||0); last=t;
  if(!paused&&!picking) update(dt);
  if(use3D()) draw3D(t); else draw(t);
  hud();
  requestAnimationFrame(loop);
}

// 頁面更新時保留進度
window.claude?.hot?.snapshot?.(()=>({G}));
function boot(d){
  let needCls=false;
  if(d&&d.G){ G=d.G; G.target=null; G.pickT=null;
    // 舊進度補上新欄位
    const p=G.p; p.skills=p.skills||{}; p.points=p.points||0;
    p.cds=p.cds||{}; p.buff=p.buff||0; p.dash=null; p.whirl=0;
    G.proj=G.proj||[]; G.allies=G.allies||[]; G.corpses=G.corpses||[]; G.meteors=G.meteors||[]; G.shake=0;
    if(!p.cls) needCls=true;
    recalc();
    if(G.map){ W=G.map.C*T; H=G.map.R*T; G.seen=G.seen||new Array(G.map.C*G.map.R).fill(0); }
    else { G.allies=[]; startFloor(); }   // 舊版沒有地城，重新產生這一層
    $('log').innerHTML=G.log.map(x=>`<div>${x}</div>`).join(''); renderUI(); }
  else {
    const sv=loadSave();
    if(sv){ newGame(sv,sv.p.cls||'war'); if(!sv.p.cls) needCls=true; }
    else { newGame(null,'war'); showClassPicker('first'); }   // 第一次玩：先選職業
  }
  if(needCls) showClassPicker('migrate');
  setSound(SFX.on);
  setView(view3D);
  setBright(bright);
  // 平板、手機一打開就用觸控版面；有觸控螢幕的筆電在第一次用手指點畫面時切換
  if(matchMedia('(pointer: coarse)').matches||(navigator.maxTouchPoints>0&&matchMedia('(hover: none)').matches)) enableTouch();
  requestAnimationFrame(loop);
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
